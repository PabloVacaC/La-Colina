version: '3'

services:
  # Servicio de Laravel (PHP)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - app_network
    depends_on:
      - mysql

  # Servidor web Nginx
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - app_network
    depends_on:
      - app

  # Servicio de MySQL
  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ColinaRootSecure2026!}
      MYSQL_DATABASE: ${DB_DATABASE:-sisdelivery}
      MYSQL_USER: ${DB_USERNAME:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ColinaAppSecure2026!}
    ports:
      # Blindaje: Solo accesible internamente por localhost, NUNCA expuesto a internet
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  # Cliente phpMyAdmin (Seguridad: solo accesible desde localhost)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_si
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1     
      MYSQL_USER: ${DB_USERNAME:-admin}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ColinaRootSecure2026!}
    networks:
      - app_network
    depends_on:
      - mysql

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local